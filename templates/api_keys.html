{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <h2 class="fw-bold mb-4">API Keys</h2>
    <form method="POST" action="{{ url_for('features.create_new_api_key') }}" class="card card-body mb-4">
        <label class="form-label" for="name">Key name</label>
        <div class="input-group"><input class="form-control" id="name" name="name" required><button class="btn btn-primary" type="submit">Create key</button></div>
    </form>
    <div class="card"><div class="table-responsive"><table class="table mb-0">
        <thead><tr><th>Name</th><th>Key</th><th>Created</th><th></th></tr></thead>
        <tbody>{% for key in keys %}
            <tr><td>{{ key.name }}</td><td><code>{{ key.key }}</code></td><td>{{ key.created_at|default('') }}</td><td><form method="POST" action="{{ url_for('features.remove_api_key', key_id=key._id) }}"><button class="btn btn-sm btn-outline-danger" type="submit">Delete</button></form></td></tr>
        {% else %}<tr><td colspan="4" class="text-center text-muted py-4">No API keys found.</td></tr>{% endfor %}</tbody>
    </table></div></div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2 class="fw-bold mb-4">Frequently Asked Questions</h2>
    <div class="accordion" id="faqList">
        {% for item in faqs %}
        <div class="accordion-item">
            <h3 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#faq{{ loop.index }}">{{ item.question }}</button></h3>
            <div id="faq{{ loop.index }}" class="accordion-collapse collapse" data-bs-parent="#faqList"><div class="accordion-body">{{ item.answer }}</div></div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
